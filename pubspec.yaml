name: emerald_tarot
description: "Arcana Notes — a dark Material 3 tarot app with 78 illustrated cards."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dynamic_color: 1.8.1
  url_launcher: ^6.3.3
  web: ^1.1.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
